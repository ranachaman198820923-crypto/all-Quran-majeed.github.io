<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Al QURAN - القرآن الكريم</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    :root {
      --primary: #2e7d32;
      --primary-light: #4caf50;
      --accent: #d4af37;
      --bg: #f4f6f8;
      --card-bg: #ffffff;
      --text: #333333;
    }
    body.dark-mode {
      --bg: #121212;
      --card-bg: #1e1e1e;
      --text: #ffffff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 70px; }
    
    /* Header */
    header {
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      color: white; padding: 15px 20px; display: flex;
      justify-content: space-between; align-items: center;
      border-bottom-left-radius: 20px; border-bottom-right-radius: 20px;
    }
    .header-title { font-size: 1.4rem; font-weight: bold; }
    .theme-toggle { cursor: pointer; font-size: 1.2rem; }

    /* Date & Prayer Bar */
    .info-card {
      background: var(--card-bg); margin: 15px; padding: 15px;
      border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);
      display: flex; justify-content: space-between; align-items: center;
    }
    .location-btn {
      background: #ffebee; color: #c62828; border: none;
      padding: 6px 12px; border-radius: 20px; font-size: 0.8rem; cursor: pointer;
    }

    /* Resume Banner */
    .resume-card {
      background: linear-gradient(135deg, #c5a059, #d4af37);
      color: white; margin: 0 15px 15px; padding: 20px;
      border-radius: 15px; display: flex; justify-content: space-between; align-items: center;
    }
    .resume-btn {
      background: white; color: #8a6d3b; border: none;
      padding: 8px 16px; border-radius: 20px; font-weight: bold; cursor: pointer;
    }

    /* Grid Navigation */
    .grid-container {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; padding: 0 15px;
    }
    .grid-card {
      background: var(--card-bg); padding: 20px; border-radius: 15px;
      text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.05); cursor: pointer;
    }
    .grid-card i { font-size: 2rem; color: var(--accent); margin-bottom: 10px; }
    .grid-card h3 { font-size: 1rem; }

    /* Main Content Sections */
    .content-section { display: none; padding: 15px; }
    .content-section.active { display: block; }
    
    /* Surah List */
    .surah-item {
      background: var(--card-bg); padding: 12px 15px; border-radius: 10px;
      margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center;
    }
    .surah-actions button {
      background: transparent; border: 1px solid var(--primary); color: var(--primary);
      padding: 5px 10px; border-radius: 5px; cursor: pointer; margin-left: 5px;
    }

    /* Reader View */
    .reader-box {
      background: var(--card-bg); padding: 20px; border-radius: 10px;
      text-align: right; font-size: 1.5rem; line-height: 2.2; direction: rtl;
    }

    /* Audio Player Bar */
    .audio-player {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: var(--card-bg); border-top: 1px solid #ccc;
      padding: 10px 20px; display: flex; align-items: center; justify-content: space-between;
    }

    /* Reciter Selector */
    select { padding: 8px; border-radius: 5px; width: 100%; margin-bottom: 15px; }
  </style>
</head>
<body>

  <header>
    <div class="header-title">Al Quran - القرآن الكريم</div>
    <div class="theme-toggle" onclick="toggleTheme()"><i class="fas => fa-moon"></i></div>
  </header>

  <!-- Dashboard Section -->
  <div id="home-view" class="content-section active">
    <div class="info-card">
      <div>
        <h4 id="hijri-date">Rabi' al-awwal 8</h4>
        <small id="gregorian-date">Saturday, 22 August</small>
      </div>
      <button class="location-btn" onclick="getLocation()"><i class="fas fa-location-arrow"></i> Enable Location</button>
    </div>

    <div class="resume-card">
      <div>
        <h3>سُورَةُ الْبَقَرَةِ</h3>
        <p>Juzz - 2</p>
      </div>
      <button class="resume-btn" onclick="openReader('Al-Baqarah')">Resume Reading</button>
    </div>

    <div style="padding: 0 15px 15px;">
      <select id="reciter-select" onchange="changeReciter(this.value)">
        <option value="ar.alafasy">Mishary Rashid Alafasy</option>
        <option value="ar.abdulbasitmurattal">Abdul Basit (Murattal)</option>
        <option value="ar.hudhaify">Ali Al-Hudhaify</option>
      </select>
    </div>

    <div class="grid-container">
      <div class="grid-card" onclick="showSection('surah-view')">
        <i class="fas fa-list-ol"></i>
        <h3>Surah Index</h3>
      </div>
      <div class="grid-card" onclick="showSection('juzz-view')">
        <i class="fas fa-book-open"></i>
        <h3>Juzz Index</h3>
      </div>
      <div class="grid-card" onclick="showSection('goto-view')">
        <i class="fas fa-file-alt"></i>
        <h3>Goto Page</h3>
      </div>
      <div class="grid-card" onclick="showSection('bookmark-view')">
        <i class="fas fa-bookmark"></i>
        <h3>Bookmarks</h3>
      </div>
    </div>
  </div>

  <!-- Surah Index Section -->
  <div id="surah-view" class="content-section">
    <button onclick="showSection('home-view')" style="margin-bottom:10px; padding: 5px 10px;">← Back</button>
    <h2>Surah Index</h2>
    <div id="surah-list" style="margin-top: 15px;"></div>
  </div>

  <!-- Reader Section -->
  <div id="reader-view" class="content-section">
    <button onclick="showSection('surah-view')" style="margin-bottom:10px; padding: 5px 10px;">← Back</button>
    <h2 id="reader-title" style="margin-bottom: 15px;">Surah</h2>
    <div class="reader-box" id="reader-content">
      بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ
    </div>
  </div>

  <!-- Audio Player -->
  <div class="audio-player">
    <div>
      <strong id="audio-title">Select a Surah</strong>
    </div>
    <audio id="main-audio" controls>
      <source id="audio-source" src="" type="audio/mp3">
      Your browser does not support the audio element.
    </audio>
  </div>

  <script>
    const surahs = [
      { id: 1, name: "Al-Fatiha", ar: "الفاتحة" },
      { id: 2, name: "Al-Baqarah", ar: "البقرة" },
      { id: 3, name: "Ali 'Imran", ar: "آل عمران" },
      { id: 4, name: "An-Nisa'", ar: "النساء" },
      { id: 5, name: "Al-Ma'idah", ar: "المائدة" },
      { id: 6, name: "Al-An'am", ar: "الأنعام" },
      { id: 7, name: "Al-A'raf", ar: "الأعراف" }
    ];

    let currentReciter = "ar.alafasy";

    // Toggle Theme
    function toggleTheme() {
      document.body.classList.toggle('dark-mode');
    }

    // Switch Views
    function showSection(sectionId) {
      document.querySelectorAll('.content-section').forEach(sec => sec.classList.remove('active'));
      document.getElementById(sectionId).classList.add('active');
    }

    // Load Surah List
    function loadSurahList() {
      const container = document.getElementById('surah-list');
      container.innerHTML = '';
      surahs.forEach(s => {
        container.innerHTML += `
          <div class="surah-item">
            <div>
              <strong>${s.id}. ${s.name}</strong><br>
              <small>${s.ar}</small>
            </div>
            <div class="surah-actions">
              <button onclick="playAudio(${s.id}, '${s.name}')"><i class="fas fa-play"></i> Play</button>
              <button onclick="openReader('${s.name}')"><i class="fas fa-book"></i> Read</button>
            </div>
          </div>
        `;
      });
    }

    // Audio Playback using Al Quran Cloud API
    function playAudio(surahNum, title) {
      const audio = document.getElementById('main-audio');
      const source = document.getElementById('audio-source');
      document.getElementById('audio-title').innerText = title;
      
      // Using public audio API stream
      source.src = `https://cdn.islamic.network/quran/audio/128/${currentReciter}/${surahNum}.mp3`;
      audio.load();
      audio.play();
    }

    function changeReciter(val) {
      currentReciter = val;
    }

    function openReader(title) {
      document.getElementById('reader-title').innerText = title;
      showSection('reader-view');
    }

    function getLocation() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(() => {
          alert("Location enabled for accurate prayer times.");
        });
      }
    }

    // Initialize App
    loadSurahList();
  </script>
</body>
</html>
